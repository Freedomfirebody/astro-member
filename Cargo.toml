[package]
name = "astro-member"
version = "0.1.0"
edition = "2021"
description = "A lightweight, hierarchical Memory MCP server"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.32", features = ["full", "io-std"] }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.4", features = ["v4", "serde"] }
rusqlite = { version = "0.29.0", features = ["bundled", "uuid", "chrono"] }
fastembed = "3.14.1"
ort = { version = "=2.0.0-rc.4" }
ort-sys = { version = "=2.0.0-rc.4" }
once_cell = "1.18"

[patch.crates-io]
hf-hub = { path = "hf-hub-0.3.2" }
