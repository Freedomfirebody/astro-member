[package]
name = "astro-member-mcp"
version = "0.2.0"
edition = "2021"
description = "A lightweight, hierarchical Memory MCP server binary"

[[bin]]
name = "astro-member"
path = "src/main.rs"

[dependencies]
astro-member = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.32", features = ["full", "io-std"] }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.4", features = ["v4", "serde"] }

