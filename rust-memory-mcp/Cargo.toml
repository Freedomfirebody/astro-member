[package]
name = "hierarchical-memory-mcp"
version = "0.1.0"
edition = "2021"
description = "A lightweight, hierarchical Memory MCP server"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.32", features = ["full", "io-std"] }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.4", features = ["v4", "serde"] }
# Using standard jsonrpc for MCP
jsonrpc-core = "18.0"
