name: Continuous Integration

# 1. 只在日常开发推送到 main 或提 PR 时触发
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # 2. 只跑测试，不跑沉重的 Release 编译和发布
  test:
    name: Run Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # 日常测试甚至可以精简平台，比如只跑 ubuntu 和 windows
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-ci-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ci-

      - name: Run Cargo Test
        run: cargo test
